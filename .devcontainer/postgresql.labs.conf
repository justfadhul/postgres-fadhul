# Lab settings for the Codespace cluster. Lessons say when a lab changes these.
listen_addresses = 'localhost'
log_lock_waits = on            # Module 4: deadlocks and lock waits appear in the server log
deadlock_timeout = '1s'
log_line_prefix = '%m [%p] %u@%d '
shared_preload_libraries = 'pg_stat_statements'
